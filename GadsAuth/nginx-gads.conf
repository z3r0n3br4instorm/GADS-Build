server {
    listen 80;
    server_name gads-mac.assurecraft.com;

    # Auth routes handled by SSO proxy directly
    location /auth/ {
        proxy_pass http://gads-sso-proxy:5050/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Everything else: proxy to SSO proxy, which validates session and forwards to GADS
    location / {
        proxy_pass http://gads-sso-proxy:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }
}
