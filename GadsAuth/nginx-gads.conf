# Reverse proxy for GADS with Auth0 SSO.
# Cloudflare handles SSL at the edge — nginx listens on plain HTTP internally.
# Template variables (${VAR}) are substituted by envsubst on container start.

server {
    listen 80;
    server_name ${GADS_DOMAIN} _ "";

    # Internal auth verification — called by auth_request for every protected route
    location = /auth/verify {
        internal;
        proxy_pass http://gads-sso-proxy:5050/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Cookie $http_cookie;
        # Needed so legacy-mode users can have their own header echoed back for upstream
        proxy_set_header Authorization $http_authorization;
    }

    # Public auth routes (login, callback, logout, silent token renewal)
    location /auth/ {
        proxy_pass http://gads-sso-proxy:5050/auth/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Cookie $http_cookie;
    }

    # Legacy auth entry point: /authenticate/legacy — drops the SSO session and opens native GADS login
    location = /authenticate/legacy {
        proxy_pass http://gads-sso-proxy:5050/authenticate/legacy;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Cookie $http_cookie;
    }

    # Older alias for the legacy auth entry point
    location /legacy/auth {
        proxy_pass http://gads-sso-proxy:5050/legacy/auth;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Cookie $http_cookie;
    }

    # Proxy health check — no auth required
    location = /healthz {
        proxy_pass http://gads-sso-proxy:5050/healthz;
        proxy_set_header Host $host;
    }

    # GADS native authenticate — SSO proxy intercepts and returns JWT for React
    location = /authenticate {
        proxy_pass http://gads-sso-proxy:5050/authenticate;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Cookie $http_cookie;
    }

    # Logout endpoint: clear session from both GADS and SSO proxy
    location = /logout {
        proxy_pass http://gads-sso-proxy:5050/logout;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    # Protected: all other routes require SSO auth, proxied to GADS hub
    location / {
        auth_request /auth/verify;

        # Pull the minted GADS JWT from the auth subrequest response
        # and inject it as the Authorization header GADS expects.
        auth_request_set $gads_token $upstream_http_x_gads_auth_token;
        auth_request_set $gads_react_token $upstream_http_x_gads_react_token;
        auth_request_set $gads_user $upstream_http_x_gads_user;
        auth_request_set $gads_role $upstream_http_x_gads_role;
        auth_request_set $gads_tenant $upstream_http_x_gads_tenant;
        auth_request_set $gads_refresh_ms $upstream_http_x_gads_refresh_ms;
        auth_request_set $gads_authorization $upstream_http_x_gads_authorization;

        # The proxy decides this value: a freshly minted token for SSO users, the client's
        # own header for legacy users. An expired token held by the SPA is never forwarded.
        # nginx omits the header entirely when the value is empty.
        proxy_set_header Authorization $gads_authorization;

        # SSO users only (not legacy mode):
        #  1. Seed/refresh the localStorage tokens the React SPA reads, on every page load.
        #  2. Renew them silently from /auth/token on a timer, so an expiring GADS token
        #     never surfaces to the user as a logout.
        #  3. GADS's logout only drops localStorage keys (no server call), so hook both
        #     removeItem and clear and send the browser to /auth/logout, which ends the
        #     proxy and Auth0 sessions and lands back on the Auth0 login screen.
        sub_filter '</head>' '<script>(function(){var u="$gads_user";if(!u)return;var S=window.localStorage,out=false;function seed(t,r,n){try{if(t)S.setItem("accessToken",t);S.setItem("username",u);if(r)S.setItem("userRole",r);if(n)S.setItem("tenant",n);}catch(e){}}function toAuth0(){if(out)return;out=true;window.location.replace("/auth/logout");}seed("$gads_react_token","$gads_role","$gads_tenant");try{var rm=Storage.prototype.removeItem;Storage.prototype.removeItem=function(k){rm.apply(this,arguments);if(this===S&&k==="accessToken")toAuth0();};var cl=Storage.prototype.clear;Storage.prototype.clear=function(){cl.apply(this,arguments);if(this===S)toAuth0();};}catch(e){}function renew(){try{var x=new XMLHttpRequest();x.open("GET","/auth/token",true);x.withCredentials=true;x.onload=function(){if(x.status===200){try{var d=JSON.parse(x.responseText);seed(d.accessToken,d.role,d.tenant);}catch(e){}}else if(x.status===401){toAuth0();}};x.send();}catch(e){}}var ms=parseInt("$gads_refresh_ms",10)||300000;setInterval(renew,ms);document.addEventListener("visibilitychange",function(){if(!document.hidden)renew();});})();</script></head>';
        sub_filter_once on;

        # Unauthenticated → redirect to Auth0 login
        error_page 401 = @force_login;

        # GADS hub runs on the host (port 10000 per installer)
        proxy_pass http://host.docker.internal:${GADS_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Accept-Encoding "";
    }

    location @force_login {
        return 302 /auth/login?redirect=$request_uri;
    }
}
