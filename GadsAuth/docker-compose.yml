services:
  # ---------------------------------------------------------------------------
  # SSO Proxy — authenticates users against Auth0, mints GADS JWTs
  # ---------------------------------------------------------------------------
  gads-sso-proxy:
    build: .
    container_name: gads-sso-proxy
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gads-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "5050"

  # ---------------------------------------------------------------------------
  # nginx — reverse proxy that enforces SSO on every request to GADS
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: gads-nginx:local
    container_name: gads-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach GADS on the host
    depends_on:
      - gads-sso-proxy
    networks:
      - gads-net

networks:
  gads-net:
    name: gads-net
    driver: bridge

